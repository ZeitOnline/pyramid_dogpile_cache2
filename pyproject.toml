[project]
name = "pyramid_dogpile_cache2"
description = "Integrates dogpile.cache for Pyramid"

dependencies = [
    "dogpile.cache >= 1.0.0.dev0",
]

authors = [{name="Die ZEIT Online Engineering", email="engineering@zeit.de"}]
license = {text="BSD-3-Clause"}
urls = {repository="https://github.com/zeitonline/pyramid_dogpile_cache2"}
requires-python = ">=3.7"

keywords = ["pyramid", "dogpile.cache"]
classifiers = [
    "Environment :: Plugins",
    "Framework :: Pyramid",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
]

dynamic = ["readme", "version"]

[dependency-groups]
dev = ["pytest"]


[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = ["/bin"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{path="README.md"}, {text="\n\n"}, {path="HACKING.md"}, {text="\n\n"}, {path="CHANGES.md"}]


[tool.pytest.ini_options]
addopts = "--tb=native"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
from-first = true
lines-after-imports = 2
